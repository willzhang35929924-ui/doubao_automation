# Template only. Copy to your private user-data directory; never publish real settings.
browser:
  headless: false
  start_maximized: true
accounts:
  doubao: []
  gemini: {}
feishu:
  app_id: ""
  app_secret: ""
  app_token: ""
  # 本机需自行创建私有文件；不要将提示词或飞书密钥提交到 GitHub。
  fixed_prompt:
    source: file
    file: config/gemini_prompt.txt
  products_table:
    table_id: ""
    keyword_field: "keyword"
    image_field: "产品图"
  scripts_table:
    table_id: ""
    keyword_field: "keyword"
    prompt_field: "提示词"
    video_field: "视频"
# Empty login settings use built-in Doubao session-cookie + visible chat UI checks.
# Visitor cookies such as uid_tt never count as proof of login.
# Visible Gemini windows wait for manual Google login (login.timeout_minutes, default 30).
login: {}
doubao:
  # Built-in conservative daily video quota patterns are used when this key is absent.
  # To replace them with platform messages you have personally verified, supply
  # quota_exhausted_patterns as a list of Python regular expressions. An empty
  # list disables text-based exhaustion detection. Never place credentials here.
  selectors:
    # Optional: quota_balance should select only the verified live video balance UI.
    # quota_balance: 'selector-for-verified-balance-element'
    input_box:
      - 'div[contenteditable="true"]'
video:
  aspect_ratio: '9:16'
